# Link check settings shared by every repository (links.yml writes this file when a repository
# has none). Keep the exclusions short and explain each one: a link that is excluded is a link
# nobody checks.

# Re-check a link at most once a day; the cache is kept between workflow runs.
cache = true
max_cache_age = "1d"
cache_exclude_status = "429, 500.."

max_concurrency = 8
max_retries = 3
timeout = 20

# Anchors (#section) in Markdown and HTML files must exist, so README buttons and the table of
# contents cannot point at a renamed heading.
include_fragments = "anchor-only"

# Only a 2xx answer, after redirects, passes. A 403 or 429 is reported too: an accepted 403 would
# also hide a page that was made private, and a rate-limited link is retried (max_retries) and
# never cached (cache_exclude_status), so the next run checks it again.
accept = ["200..=299"]

exclude_loopback = true
exclude_private = true
exclude_link_local = true

exclude = [
  # Sites that answer automated requests with 999 or a sign-in wall.
  '^https://(www\.)?linkedin\.com/',
  '^https://(www\.)?x\.com/',
  # Placeholder hosts used in code samples.
  '^https?://(www\.)?example\.(com|org|net)',
  '^https?://api\.example\.com',
  # Pull request and comparison pages that only exist after a push.
  '^https://github\.com/[^/]+/[^/]+/compare/',
]

# The READMEs link to this repository's own files on main (graphics in .github/brand, screenshots
# in docs/images, Package.swift, LICENSE, folders). A pull request cannot change main, so the
# checked-out files stand in for them: on main they are the same files, on a pull request they are
# the ones it adds or removes. The path is the workspace of GitHub-hosted runners; a local run
# passes the same two --remap options with its own path.
remap = [
  '^https://raw\.githubusercontent\.com/muhittincamdali/mobile-developer-roadmap/main/(.*)$ file:///home/runner/work/mobile-developer-roadmap/mobile-developer-roadmap/$1',
  '^https://github\.com/muhittincamdali/mobile-developer-roadmap/(?:blob|tree)/main/(.*)$ file:///home/runner/work/mobile-developer-roadmap/mobile-developer-roadmap/$1',
  # The documentation pages on GitHub Pages are built from the .docc catalog by docs.yml after a
  # push to main, so a pull request that adds a page, or the first one before Pages is deployed,
  # links to a page that is not online yet. Each page URL, the documentation root included, is
  # checked against its source file instead. docs.yml itself fails when the site cannot be built.
  '^https://muhittincamdali\.github\.io/mobile-developer-roadmap/documentation/roadmapkit/?$ file:///home/runner/work/mobile-developer-roadmap/mobile-developer-roadmap/Sources/RoadmapKit/RoadmapKit.docc/RoadmapKit.md',
  '^https://muhittincamdali\.github\.io/mobile-developer-roadmap/documentation/roadmapkit/gettingstarted$ file:///home/runner/work/mobile-developer-roadmap/mobile-developer-roadmap/Sources/RoadmapKit/RoadmapKit.docc/GettingStarted.md',
  '^https://muhittincamdali\.github\.io/mobile-developer-roadmap/documentation/roadmapkit/planningalearningpath$ file:///home/runner/work/mobile-developer-roadmap/mobile-developer-roadmap/Sources/RoadmapKit/RoadmapKit.docc/PlanningALearningPath.md',
  '^https://muhittincamdali\.github\.io/mobile-developer-roadmap/documentation/roadmapkit/writingtopics$ file:///home/runner/work/mobile-developer-roadmap/mobile-developer-roadmap/Sources/RoadmapKit/RoadmapKit.docc/WritingTopics.md',
]

exclude_path = [
  "node_modules",
  ".build",
  "build",
  "Pods",
]
