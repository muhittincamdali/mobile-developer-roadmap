# XcodeGen spec for RoadmapExplorer.xcodeproj. The project file is committed, so XcodeGen is only
# needed after changing this file: run `xcodegen` in this folder.
name: RoadmapExplorer
options:
  bundleIdPrefix: io.github.muhittincamdali
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
packages:
  MobileDeveloperRoadmap:
    path: ../..
targets:
  RoadmapExplorer:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: RoadmapExplorer
      # The app reads the same Markdown files as the command line tool, copied as a folder.
      - path: ../../roadmap
        type: folder
        buildPhase: resources
    dependencies:
      - package: MobileDeveloperRoadmap
        product: RoadmapKit
    settings:
      base:
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "2.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Roadmap
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        # Sign to run locally on the Mac; the simulator needs no signing.
        "CODE_SIGN_IDENTITY[sdk=macosx*]": "-"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_APP_SANDBOX: YES
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: NO
schemes:
  RoadmapExplorer:
    build:
      targets:
        RoadmapExplorer: all
    run:
      config: Debug
